name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BEEP_BASE: /${{ github.event.repository.name }}/
          VITE_NOVA_OFFLINE: "1"
      # Give every known route its own index.html so deep links return 200;
      # 404.html catches anything else.
      - run: |
          cp dist/index.html dist/404.html
          for r in cart ceo compare desk devices hq mine orders signal \
                   device/glass device/slate device/deck device/ping device/canvas \
                   device/hub device/view device/arc device/pod device/fin; do
            mkdir -p "dist/$r" && cp dist/index.html "dist/$r/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
