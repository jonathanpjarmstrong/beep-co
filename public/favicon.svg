<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1d170c"/>
      <stop offset=".55" stop-color="#0b0a07"/>
      <stop offset="1" stop-color="#050504"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#d9d6cf"/>
      <stop offset=".55" stop-color="#8e8a82"/>
      <stop offset=".75" stop-color="#e6e2da"/>
      <stop offset="1" stop-color="#7a766e"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/>
      <stop offset=".5" stop-color="#a9a59d"/>
      <stop offset="1" stop-color="#4b4943"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a87432" stop-opacity=".2"/>
      <stop offset=".35" stop-color="#f0d7a2"/>
      <stop offset=".6" stop-color="#e4a24a"/>
      <stop offset="1" stop-color="#a87432" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="lens" cx="40%" cy="38%" r="60%">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset=".25" stop-color="#f0b860"/>
      <stop offset=".6" stop-color="#7a4a12"/>
      <stop offset="1" stop-color="#120c04"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e4a24a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="front">
      <rect x="-300" y="0" width="600" height="300"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)" opacity=".07"/>
  <ellipse cx="256" cy="262" rx="180" ry="130" fill="#e4a24a" opacity=".16" filter="url(#soft)"/>

  <!-- HUD ring with tick marks -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#e4a24a" stroke-width="2.5" opacity=".55" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="186" fill="none" stroke="#e4a24a" stroke-width="2" stroke-dasharray="2 14" opacity=".5"/>

  <g transform="translate(256 256) scale(1.16) translate(-256 -284)">
  <!-- Orbit, back half (behind the mark) -->
  <g transform="translate(256 330) rotate(-14)">
    <ellipse rx="200" ry="54" fill="none" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
  </g>

  <!-- Droid dome -->
  <rect x="242" y="136" width="30" height="18" rx="4" fill="url(#metal)"/>
  <path d="M164 252A94 94 0 0 1 352 252Z" fill="url(#dome)"/>
  <path d="M175 221H341L346 238H170Z" fill="#14130f"/>
  <rect x="190" y="226" width="22" height="7" rx="2" fill="#e4a24a" opacity=".9"/>
  <rect x="220" y="226" width="12" height="7" rx="2" fill="#5ee7ff" opacity=".8"/>
  <rect x="240" y="226" width="34" height="7" rx="2" fill="#3a3a38"/>
  <path d="M206 172H252V200H200Z" fill="#14130f" opacity=".85"/>
  <circle cx="298" cy="192" r="22" fill="#0c0b08" stroke="#2a2820" stroke-width="4"/>
  <circle cx="298" cy="192" r="15" fill="url(#lens)" filter="url(#glow)"/>
  <circle cx="293" cy="187" r="4" fill="#fffaf0"/>

  <!-- Metallic B, slight italic -->
  <g transform="translate(262 344) skewX(-9) translate(-262 -344)">
    <path fill="url(#metal)" fill-rule="evenodd" d="M156 258H306A42.5 42.5 0 0 1 306 343H318A45 45 0 0 1 318 433H156Z M202 286H302A13.5 13.5 0 0 1 302 313H202Z M202 368H312A16.5 16.5 0 0 1 312 401H202Z"/>
    <path fill="none" stroke="#fff8e8" stroke-opacity=".55" stroke-width="2" d="M156 258H306A42.5 42.5 0 0 1 348.5 300.5"/>
  </g>

  <!-- Orbit, front half (over the mark) -->
  <g transform="translate(256 330) rotate(-14)" clip-path="url(#front)">
    <ellipse rx="200" ry="54" fill="none" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
  </g>
  <circle cx="440" cy="300" r="5" fill="#fff4d6" filter="url(#glow)"/>
  </g>
</svg>
